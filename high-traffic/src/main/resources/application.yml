server:
  port: 8081

spring:
  application:
    name: high-traffic

  profiles:
    active: local

  # JPA
  jpa:
    hibernate:
      ddl-auto: update
    # show-sql 은 stdout 으로 무조건 찍어버리므로 사용하지 않는다.
    # SQL 로그는 아래 logging.level 의 org.hibernate.SQL 레벨로 제어한다.
    #  - INFO (기본)  : SQL 안 찍힘
    #  - DEBUG       : SQL 찍힘
    #  - org.hibernate.orm.jdbc.bind=TRACE : 바인딩 파라미터까지 찍힘
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  # PostgreSQL
  datasource:
    url: jdbc:postgresql://localhost:6543/traffic-pg
    username: traffic-pg
    password: traffic-pg
    driver-class-name: org.postgresql.Driver

  # Redis
  data:
    redis:
      host: localhost
      port: 6379

  # Kafka
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: high-traffic-consumer-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

# Swagger
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    show-extensions: true
    show-common-extensions: true

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
